<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos | Predicciones</title>
    <script src="{{ url_for('static', filename='theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='workspace.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="{{ url_for('static', filename='workspace.js') }}" defer></script>
</head>
<body>
    {% include 'workspace.html' %}
    <script>
// Global variables
        let currentDataFile = null;
        let currentDataInfo = null;
        let availableModels = [];
        let modelLoaded = false;
        let loadedContextLength = 0;
        let krakenPairs = [];

        // Initialize after page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        // Initialize application
        async function initializeApp() {
            Workspace.init();
            console.log('🚀 Initializing Kronos Web UI...');

            // Set up event listeners
            setupEventListeners();

            // Initialize time slider
            initializeTimeSlider();
            await Promise.allSettled([loadAvailableModels(), loadDataFiles(), loadKrakenPairs(), updateModelStatus()]);

            console.log('✅ Application initialization completed');
        }

        // Load available models
        async function loadAvailableModels() {
            try {
                const response = await axios.get('/api/available-models');
                if (response.data.model_available) {
                    availableModels = response.data.models;
                    populateModelSelect();
                    console.log('✅ Available models loaded successfully:', availableModels);
                } else {
                    console.warn('⚠️ Kronos model library not available');
                    showStatus('warning', 'Kronos model library not available, will use simulated prediction');
                }
            } catch (error) {
                console.error('❌ Failed to load available models:', error);
                showStatus('error', 'Failed to load available models');
            }
        }

        // Populate model selection dropdown
        function populateModelSelect() {
            const modelSelect = document.getElementById('model-select');
            modelSelect.innerHTML = '<option value="">Please select model</option>';

            Object.entries(availableModels).forEach(([key, model]) => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = `${model.name} (${model.params}) - ${model.description}`;
                modelSelect.appendChild(option);
            });
            modelSelect.value = 'kronos-mini';
        }

        // Load model
        async function loadModel() {
            const modelKey = document.getElementById('model-select').value;
            const device = document.getElementById('device-select').value;

            if (!modelKey) {
                showStatus('error', 'Please select a model to load');
                return;
            }

            try {
                showLoading(true);
                document.getElementById('load-model-btn').disabled = true;

                const response = await axios.post('/api/load-model', {
                    model_key: modelKey,
                    device: device
                });

                if (response.data.success) {
                    modelLoaded = true;
                    loadedContextLength = response.data.model_info.context_length;
                    showStatus('success', response.data.message);
                    updateModelStatus();
                    updatePredictionMode();
                    console.log('✅ Model loaded successfully:', response.data.model_info);
                } else {
                    showStatus('error', response.data.error);
                }
            } catch (error) {
                console.error('❌ Model loading failed:', error);
                showStatus('error', `Model loading failed: ${error.response?.data?.error || error.message}`);
            } finally {
                showLoading(false);
                document.getElementById('load-model-btn').disabled = false;
            }
        }

        // Update model status
        async function updateModelStatus() {
            try {
                const response = await axios.get('/api/model-status');
                const status = response.data;
                modelLoaded = Boolean(status.loaded);
                loadedContextLength = status.current_model?.context_length || 0;
                updatePredictionMode();

                if (status.loaded) {
                    showStatus('success', `Model loaded: ${status.current_model.name} on ${status.current_model.device}`);
                } else if (status.available) {
                    showStatus('info', 'Model available but not loaded');
                } else {
                    showStatus('warning', 'Model library not available');
                }
            } catch (error) {
                console.error('❌ Failed to get model status:', error);
            }
        }

        // Load data file list
        async function loadDataFiles(selectedPath = '') {
            try {
                const response = await axios.get('/api/data-files');
                const dataFiles = response.data;

                const dataFileSelect = document.getElementById('data-file-select');
                dataFileSelect.innerHTML = '<option value="">Please select data file</option>';

                dataFiles.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.path;
                    option.textContent = `${file.name} (${file.size})`;
                    dataFileSelect.appendChild(option);
                });
                dataFileSelect.value = selectedPath;
                document.getElementById('load-data-btn').disabled = !dataFileSelect.value;
                document.getElementById('data-file-help').textContent = dataFiles.length
                    ? 'Select an existing file or upload one from your computer below.'
                    : 'No data files available. Choose a file from your computer below.';
                if (!dataFiles.length) {
                    dataFileSelect.innerHTML = '<option value="">No data files available</option>';
                }

                console.log('✅ Data file list loaded successfully:', dataFiles);
            } catch (error) {
                console.error('❌ Failed to load data file list:', error);
                document.getElementById('data-file-help').textContent = 'Could not load the file list. You can still upload a file below.';
                showStatus('error', 'Failed to load data file list');
            }
        }

        async function selectAndLoadData(filePath, name) {
            await loadDataFiles(filePath);
            const select = document.getElementById('data-file-select');
            if (select.value !== filePath) {
                select.add(new Option(name, filePath));
                select.value = filePath;
            }
            return await loadData();
        }

        function populateKrakenPairs(preferred = document.getElementById('kraken-pair').value) {
            const select = document.getElementById('kraken-pair');
            const search = document.getElementById('kraken-search').value.trim().toUpperCase();
            select.innerHTML = '<option value="">Selecciona un par</option>';
            krakenPairs.filter(pair => pair.name.toUpperCase().includes(search) || pair.code.toUpperCase().includes(search)).forEach(pair => {
                select.add(new Option(pair.name, pair.code));
            });
            select.value = preferred;
            document.getElementById('import-kraken-btn').disabled = !select.value;
        }

        async function loadKrakenPairs() {
            const button = document.getElementById('reload-kraken-pairs-btn');
            const status = document.getElementById('kraken-status');
            button.disabled = true;
            status.textContent = 'Consultando pares disponibles de Kraken…';
            try {
                const response = await axios.get('/api/kraken-pairs', {timeout: 25000});
                const preferred = document.getElementById('kraken-pair').value || 'XBTEUR';
                krakenPairs = response.data.pairs;
                populateKrakenPairs(preferred);
                status.textContent = 'Kraken ofrece hasta 719 velas cerradas: a 1 hora, 29 días y 23 horas. La muestra se adapta a los datos y al modelo; mínimo 80 velas.';
            } catch (error) {
                status.textContent = `No se pudieron actualizar los pares: ${error.response?.data?.error || error.message}. Pulsa Actualizar pares para reintentar.`;
                if (!krakenPairs.length) document.getElementById('kraken-pair').innerHTML = '<option value="">Pares no disponibles</option>';
            } finally { button.disabled = false; }
        }

        async function importKrakenData() {
            const pair = document.getElementById('kraken-pair').value;
            const interval = Number(document.getElementById('kraken-interval').value);
            if (!pair) return;
            const controls = ['import-kraken-btn', 'kraken-pair', 'kraken-interval', 'kraken-search', 'reload-kraken-pairs-btn'];
            controls.forEach(id => { document.getElementById(id).disabled = true; });
            const status = document.getElementById('kraken-status');
            status.textContent = 'Descargando velas cerradas de Kraken…';
            showLoading(true);
            try {
                const response = await axios.post('/api/import-kraken', {pair, interval}, {timeout: 50000});
                const filePath = response.data.file_path;
                const download = document.getElementById('kraken-download');
                download.href = '/api/data-download?file_path=' + encodeURIComponent(filePath);
                download.hidden = false;
                const loaded = await selectAndLoadData(filePath, `Kraken ${pair} (${interval} min)`);
                const enough = loaded && response.data.rows >= 80;
                status.textContent = response.data.message + (enough ? ' Datos listos; carga el modelo para ejecutar la predicción.' : loaded ? ' Histórico cargado; faltan velas para completar la muestra.' : ' CSV guardado; vuelve a cargarlo desde la lista de archivos.');
            } catch (error) {
                status.textContent = `No se pudieron importar los datos: ${error.response?.data?.error || error.message}`;
            } finally {
                showLoading(false);
                controls.forEach(id => { document.getElementById(id).disabled = false; });
                document.getElementById('import-kraken-btn').disabled = !document.getElementById('kraken-pair').value;
            }
        }

        async function uploadDataFile() {
            const input = document.getElementById('data-file-upload');
            const file = input.files[0];
            if (!file) return;
            if (!/\.(csv|feather)$/i.test(file.name) || file.size > 50 * 1024 * 1024) {
                showStatus('error', 'Choose a CSV or Feather file up to 50 MB.');
                input.value = '';
                return;
            }
            input.disabled = true;
            showLoading(true);
            try {
                const formData = new FormData();
                formData.append('file', file);
                const response = await axios.post('/api/upload-data', formData);
                await selectAndLoadData(response.data.file_path, file.name);
            } catch (error) {
                showStatus('error', `Upload failed: ${error.response?.data?.error || error.message}`);
            } finally {
                input.disabled = false;
                input.value = '';
                showLoading(false);
            }
        }

        // Load data file
        async function loadData() {
            const filePath = document.getElementById('data-file-select').value;

            if (!filePath) {
                showStatus('error', 'Please select a data file to load');
                return;
            }

            try {
                showLoading(true);
                document.getElementById('load-data-btn').disabled = true;

                const response = await axios.post('/api/load-data', {
                    file_path: filePath
                });

                if (response.data.success) {
                    currentDataFile = filePath;
                    currentDataInfo = response.data.data_info;
                    showDataInfo(response.data.data_info);
                    showStatus('success', response.data.message);

                    // Update prediction button status
                    updatePredictionMode();
                    document.getElementById('prediction-summary').style.display = 'none';
                    document.getElementById('comparison-section').style.display = 'none';
                    Workspace.clearResults();

                    console.log('✅ Data loaded successfully:', response.data.data_info);
                    return true;
                } else {
                    showStatus('error', response.data.error);
                }
            } catch (error) {
                console.error('❌ Data loading failed:', error);
                showStatus('error', `Data loading failed: ${error.response?.data?.error || error.message}`);
            } finally {
                showLoading(false);
                document.getElementById('load-data-btn').disabled = false;
            }
            return false;
        }

        // Display data information
        function showDataInfo(dataInfo) {
            document.getElementById('data-info').style.display = 'block';
            document.getElementById('data-empty').hidden = true;
            document.getElementById('data-rows').textContent = dataInfo.rows;
            document.getElementById('data-cols').textContent = dataInfo.columns.length;
            document.getElementById('data-time-range').textContent = `${dataInfo.start_date} to ${dataInfo.end_date}`;
            document.getElementById('data-price-range').textContent = `${dataInfo.price_range.min.toFixed(4)} - ${dataInfo.price_range.max.toFixed(4)}`;
            document.getElementById('data-timeframe').textContent = dataInfo.timeframe;
            document.getElementById('data-prediction-cols').textContent = dataInfo.prediction_columns.join(', ');

            // Initialize time window slider
            initializeTimeWindowSlider(dataInfo);
        }

                    // Time window slider related variables
        let sliderData = null;
        let isDragging = false;
        let currentHandle = null;

        // Initialize time window slider
        function initializeTimeSlider() {
            // Set up slider event listeners
            setupSliderEventListeners();
        }

        // Set up slider event listeners
        function setupSliderEventListeners() {
            const startHandle = document.getElementById('start-handle');
            const endHandle = document.getElementById('end-handle');
            const track = document.querySelector('.slider-track');

            // Start dragging
            startHandle.addEventListener('mousedown', (e) => {
                isDragging = true;
                currentHandle = 'start';
                e.preventDefault();
            });

            endHandle.addEventListener('mousedown', (e) => {
                isDragging = true;
                currentHandle = 'end';
                e.preventDefault();
            });

            // Dragging
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const rect = track.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentage = Math.max(0, Math.min(1, x / rect.width));

                if (currentHandle === 'start') {
                    updateStartHandle(percentage);
                } else if (currentHandle === 'end') {
                    updateEndHandle(percentage);
                }

                updateSliderFromHandles();
            });

            // End dragging
            document.addEventListener('mouseup', () => {
                isDragging = false;
                currentHandle = null;
            });

            // Click track to set position directly
            track.addEventListener('click', (e) => {
                const rect = track.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentage = Math.max(0, Math.min(1, x / rect.width));

                // Determine which handle is closer to the click position
                const startHandle = document.getElementById('start-handle');
                const endHandle = document.getElementById('end-handle');
                const startRect = startHandle.getBoundingClientRect();
                const endRect = endHandle.getBoundingClientRect();

                if (Math.abs(x - (startRect.left - rect.left)) < Math.abs(x - (endRect.left - rect.left))) {
                    updateStartHandle(percentage);
                } else {
                    updateEndHandle(percentage);
                }

                updateSliderFromHandles();
            });
        }

        // Update start handle position
        function updateStartHandle(percentage) {
            const startHandle = document.getElementById('start-handle');
            const selection = document.getElementById('slider-selection');

            // Context plus comparison candles.
            const windowSize = Number(document.getElementById('lookback').value) + 120;
            const totalRows = sliderData ? sliderData.totalRows : 1000;
            const windowPercentage = windowSize / totalRows;

            // Ensure start handle doesn't cause window to exceed data range
            if (percentage + windowPercentage > 1) {
                percentage = 1 - windowPercentage;
            }

            startHandle.style.left = (percentage * 100) + '%';
            selection.style.left = (percentage * 100) + '%';
            selection.style.width = (windowPercentage * 100) + '%';

            // Automatically adjust end handle position to maintain fixed window size
            const endHandle = document.getElementById('end-handle');
            endHandle.style.left = ((percentage + windowPercentage) * 100) + '%';
        }

        // Update end handle position
        function updateEndHandle(percentage) {
            const endHandle = document.getElementById('end-handle');
            const selection = document.getElementById('slider-selection');

            // Context plus comparison candles.
            const windowSize = Number(document.getElementById('lookback').value) + 120;
            const totalRows = sliderData ? sliderData.totalRows : 1000;
            const windowPercentage = windowSize / totalRows;

            // Ensure end handle doesn't cause window to exceed data range
            if (percentage - windowPercentage < 0) {
                percentage = windowPercentage;
            }

            endHandle.style.left = (percentage * 100) + '%';
            selection.style.left = ((percentage - windowPercentage) * 100) + '%';
            selection.style.width = (windowPercentage * 100) + '%';

            // Automatically adjust start handle position to maintain fixed window size
            const startHandle = document.getElementById('start-handle');
            startHandle.style.left = ((percentage - windowPercentage) * 100) + '%';
        }

        // Update slider display based on handle positions
        function updateSliderFromHandles() {
            const startHandle = document.getElementById('start-handle');
            const endHandle = document.getElementById('end-handle');

            const startPercentage = parseFloat(startHandle.style.left) / 100;
            const endPercentage = parseFloat(endHandle.style.left) / 100;

            if (!sliderData) return;

            // Calculate selected time range
            const totalTime = sliderData.endDate.getTime() - sliderData.startDate.getTime();
            const startTime = sliderData.startDate.getTime() + (totalTime * startPercentage);
            const endTime = sliderData.startDate.getTime() + (totalTime * endPercentage);

            const startDate = new Date(startTime);
            const endDate = new Date(endTime);

            // Update display information
            document.getElementById('window-start').textContent = `Start: ${startDate.toLocaleDateString()}`;
            document.getElementById('window-end').textContent = `End: ${endDate.toLocaleDateString()}`;

            // Display fixed window size
            const lookback = Number(document.getElementById('lookback').value);
            document.getElementById('window-size').textContent = `${lookback} + 120 = ${lookback + 120} velas`;
        }

        // Update slider based on input fields
        function updateSliderFromInputs() {
            if (!sliderData) return;
            if (document.getElementById('prediction-mode').value !== 'backtest') return;

            // Use the context required by the loaded data frequency.
            const lookback = Number(document.getElementById('lookback').value);
            const predLen = 120;
            const windowSize = lookback + predLen;

            // Calculate slider position
            const totalRows = sliderData.totalRows;

            if (windowSize > totalRows) {
                // If window size exceeds total data amount, show error
                showStatus('error', `Insufficient data, need at least ${windowSize} data points, currently only ${totalRows} available`);
                return;
            }

            // Default to the last complete backtest window in the file.
            const startPercentage = 1 - (windowSize / totalRows);
            const endPercentage = 1;

            // Update handle positions
            updateStartHandle(startPercentage);
            updateEndHandle(endPercentage);

            // Update display information
            updateSliderFromHandles();
        }

        // Initialize time window slider
        function initializeTimeWindowSlider(dataInfo) {
            updatePredictionMode();
            sliderData = {
                startDate: new Date(dataInfo.start_date),
                endDate: new Date(dataInfo.end_date),
                totalRows: dataInfo.rows,
                timeframe: dataInfo.timeframe
            };

            // Set slider labels
            document.getElementById('min-label').textContent = dataInfo.start_date.split('T')[0];
            document.getElementById('max-label').textContent = dataInfo.end_date.split('T')[0];

            // Initialize slider position
            updateSliderFromInputs();
            updatePredictionMode();
        }

        function formatDataTime(value) {
            return value ? value.replace('T', ' ') : '—';
        }

        function updatePredictionMode() {
            const forecast = document.getElementById('prediction-mode').value === 'forecast';
            const preferred = currentDataInfo?.preferred_lookback || 719;
            const available = currentDataInfo ? currentDataInfo.rows - (forecast ? 0 : 120) : preferred;
            const lookback = Math.max(80, Math.min(preferred, available, loadedContextLength || 2048));
            const contextChanged = Number(document.getElementById('lookback').value) !== lookback;
            document.getElementById('lookback').value = lookback;
            if (contextChanged && !forecast && sliderData) updateSliderFromInputs();
            document.getElementById('backtest-window').style.display = forecast ? 'none' : 'block';
            document.getElementById('forecast-range').style.display = forecast && currentDataInfo ? 'block' : 'none';
            document.getElementById('prediction-mode-info').textContent = forecast
                ? `Usa las últimas ${lookback} velas reales para predecir las próximas 120.${preferred === 719 ? ` A 1 hora: ${(lookback / 24).toFixed(2)} días de muestra. Kraken ofrece hasta 719 velas cerradas; el tamaño se adapta al histórico y al modelo.` : ''}`
                : `Usa ${lookback} velas pasadas y 120 conocidas para comparar. Este modo no predice el futuro.`;
            if (currentDataInfo) {
                document.getElementById('forecast-context-end').textContent = formatDataTime(currentDataInfo.end_date);
                document.getElementById('forecast-dates').textContent = `${formatDataTime(currentDataInfo.forecast_start)} → ${formatDataTime(currentDataInfo.forecast_end)}`;
            }
            const required = lookback + (forecast ? 0 : 120);
            const enoughData = currentDataInfo && currentDataInfo.rows >= required;
            if (currentDataInfo && !enoughData) {
                document.getElementById('prediction-mode-info').textContent += ` Solo hay ${currentDataInfo.rows} velas; se necesitan ${required}. Carga un CSV con más histórico.`;
            }
            if (modelLoaded && loadedContextLength < lookback) {
                document.getElementById('prediction-mode-info').textContent += ' Carga Kronos-mini para utilizar toda la muestra.';
            }
            document.getElementById('predict-btn').disabled = !modelLoaded || !enoughData || loadedContextLength < lookback;
            document.getElementById('predict-btn').textContent = forecast ? 'Predecir próximas 120 velas' : 'Ejecutar comparación histórica';
        }

        // Start prediction
        async function startPrediction() {
            if (!currentDataFile) {
                showStatus('error', 'Please load data file first');
                return;
            }

            if (!modelLoaded) {
                showStatus('error', 'Please load model first');
                return;
            }
            const mode = document.getElementById('prediction-mode').value;
            const required = Number(document.getElementById('lookback').value) + (mode === 'forecast' ? 0 : 120);
            if (!currentDataInfo || currentDataInfo.rows < required) {
                showStatus('error', `Se necesitan ${required} velas para este modo.`);
                return;
            }

            try {
                showLoading(true);
                document.getElementById('predict-btn').disabled = true;

                const lookback = parseInt(document.getElementById('lookback').value);
                const predLen = parseInt(document.getElementById('pred-len').value);

                // Get prediction quality parameters
                const temperature = parseFloat(document.getElementById('temperature').value);
                const topP = parseFloat(document.getElementById('top-p').value);
                const sampleCount = parseInt(document.getElementById('sample-count').value);

                let predictionParams = {
                    file_path: currentDataFile,
                    lookback: lookback,
                    pred_len: predLen,
                    mode: mode,
                    temperature: temperature,
                    top_p: topP,
                    sample_count: sampleCount
                };
                if (mode === 'backtest') {
                    if (!sliderData) throw new Error('Time window slider not initialized');
                    const startPercentage = parseFloat(document.getElementById('start-handle').style.left) / 100;
                    predictionParams.start_index = Math.max(0, Math.min(
                        currentDataInfo.rows - lookback - predLen,
                        Math.round(startPercentage * sliderData.totalRows)
                    ));
                }

                console.log('🚀 Starting prediction, parameters:', predictionParams);

                const response = await axios.post('/api/predict', predictionParams);

                if (response.data.success) {
                    // Display prediction results
                    displayPredictionResult(response.data);
                    showStatus('success', response.data.message);
                } else {
                    showStatus('error', response.data.error);
                }
            } catch (error) {
                console.error('❌ Prediction failed:', error);
                showStatus('error', `Prediction failed: ${error.response?.data?.error || error.message}`);
            } finally {
                showLoading(false);
                updatePredictionMode();
            }
        }

        // Display prediction results
        function displayPredictionResult(result) {
            const market = result.market || currentDataInfo || {};
            document.getElementById('results-market-info').hidden = false;
            document.getElementById('results-pair').textContent = market.pair_name || market.pair || 'Par no identificado';
            document.getElementById('results-market-detail').textContent = market.source === 'Kraken'
                ? `Kraken · ${market.interval_minutes} min por vela · UTC`
                : `Archivo: ${market.filename || currentDataFile?.split(/[\\/]/).pop() || 'sin nombre'}`;
            const summary = document.getElementById('prediction-summary');
            summary.style.display = 'block';
            summary.textContent = `${result.mode === 'backtest' ? 'Comparación histórica' : 'Predicción futura'}: ${formatDataTime(result.prediction_start)} → ${formatDataTime(result.prediction_end)}. Última vela usada: ${formatDataTime(result.context_end)}. Fechas del archivo (Kraken: UTC).`;
            // Display chart
            const chartData = JSON.parse(result.chart);
            Workspace.showResults(result.mode);
            Plotly.newPlot('chart', chartData.data, Workspace.chartTheme(chartData.layout), {responsive: true, displaylogo: false, scrollZoom: true});

            // Display comparison analysis (if actual data exists)
            if (result.has_comparison) {
                displayComparisonAnalysis(result);
            } else {
                document.getElementById('comparison-section').style.display = 'none';
            }
        }

        // Display comparison analysis
        function displayComparisonAnalysis(result) {
            document.getElementById('comparison-section').style.display = 'block';

            // Update comparison information
            document.getElementById('prediction-type').textContent = result.prediction_type;
            document.getElementById('comparison-data').textContent = `${result.actual_data.length} actual data points`;

            // Calculate error statistics
            const errorStats = getPredictionQuality(result.prediction_results, result.actual_data);

            // Display error statistics
            document.getElementById('mae').textContent = errorStats.mae.toFixed(4);
            document.getElementById('rmse').textContent = errorStats.rmse.toFixed(4);
            document.getElementById('mape').textContent = errorStats.mape.toFixed(2);

            // Fill comparison table
            fillComparisonTable(result.prediction_results, result.actual_data);
        }

        // Calculate prediction quality metrics
        function getPredictionQuality(predictions, actuals) {
            if (!predictions || !actuals || predictions.length === 0 || actuals.length === 0) {
                return { mae: 0, rmse: 0, mape: 0 };
            }

            const minLen = Math.min(predictions.length, actuals.length);
            let mae = 0, rmse = 0, mape = 0;

            for (let i = 0; i < minLen; i++) {
                const pred = predictions[i];
                const act = actuals[i];

                // Use closing price to calculate errors
                const error = Math.abs(pred.close - act.close);
                const percentError = (error / act.close) * 100;

                mae += error;
                rmse += error * error;
                mape += percentError;
            }

            mae /= minLen;
            rmse = Math.sqrt(rmse / minLen);
            mape /= minLen;

            return { mae, rmse, mape };
        }

                    // Fill comparison table
        function fillComparisonTable(predictions, actuals) {
            const tbody = document.getElementById('comparison-tbody');
            tbody.innerHTML = '';

            const minLen = Math.min(predictions.length, actuals.length);

            for (let i = 0; i < minLen; i++) {
                const pred = predictions[i];
                const act = actuals[i];

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${new Date(pred.timestamp).toLocaleString()}</td>
                    <td>${act.open.toFixed(4)}</td>
                    <td>${pred.open.toFixed(4)}</td>
                    <td>${act.high.toFixed(4)}</td>
                    <td>${pred.high.toFixed(4)}</td>
                    <td>${act.low.toFixed(4)}</td>
                    <td>${pred.low.toFixed(4)}</td>
                    <td>${act.close.toFixed(4)}</td>
                    <td>${pred.close.toFixed(4)}</td>
                `;
                tbody.appendChild(row);
            }
        }

        // Set up event listeners
        function setupEventListeners() {
            // Load model button
            document.getElementById('load-model-btn').addEventListener('click', loadModel);

            // Load data button
            document.getElementById('load-data-btn').addEventListener('click', loadData);
            document.getElementById('data-file-select').addEventListener('change', function() {
                document.getElementById('load-data-btn').disabled = !this.value;
            });
            document.getElementById('data-file-upload').addEventListener('change', uploadDataFile);
            document.getElementById('reload-kraken-pairs-btn').addEventListener('click', loadKrakenPairs);
            document.getElementById('kraken-search').addEventListener('input', () => populateKrakenPairs());
            document.getElementById('kraken-pair').addEventListener('change', function() {
                document.getElementById('import-kraken-btn').disabled = !this.value;
            });
            document.getElementById('import-kraken-btn').addEventListener('click', importKrakenData);
            document.getElementById('prediction-mode').addEventListener('change', function() {
                updatePredictionMode();
                updateSliderFromInputs();
                document.getElementById('prediction-summary').style.display = 'none';
                document.getElementById('comparison-section').style.display = 'none';
                Workspace.clearResults();
            });

            // Prediction button
            document.getElementById('predict-btn').addEventListener('click', startPrediction);

            // Prediction quality parameter sliders
            document.getElementById('temperature').addEventListener('input', function() {
                document.getElementById('temperature-value').textContent = this.value;
            });

            document.getElementById('top-p').addEventListener('input', function() {
                document.getElementById('top-p-value').textContent = this.value;
            });

            // Update slider when lookback window size changes
            document.getElementById('lookback').addEventListener('input', updateSliderFromInputs);
            document.getElementById('pred-len').addEventListener('input', updateSliderFromInputs);
        }

        // Display status information
        function showStatus(type, message) {
            const statusDiv = document.getElementById('model-status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            // Auto-hide
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        // Show/hide loading status
        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            if (show) {
                loadingDiv.classList.add('show');
            } else {
                loadingDiv.classList.remove('show');
            }
        }

    </script>
</body>
